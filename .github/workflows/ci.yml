name: Cloud Computing CI

on:
  push:
    branches:
      - main
      - master
      - final
  pull_request:

permissions:
  contents: read

jobs:

  linting:
    name: 1 - Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          python -m ruff check app tests tools scripts


  unit-tests:
    name: 2 - Unit Tests
    runs-on: ubuntu-latest
    needs: linting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests -q


  model-evaluation:
    name: 3 - Model Evaluation
    runs-on: ubuntu-latest
    needs: unit-tests

    permissions:
      contents: read

    env:
      RELEASE_TAG: final
      MODEL_ASSET: pythia-70m-command-parser.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download model from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-model
          gh release download "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --pattern "${MODEL_ASSET}" \
            --dir release-model

      - name: Verify downloaded model
        run: |
          test -f "release-model/${MODEL_ASSET}"
          unzip -t "release-model/${MODEL_ASSET}"

      - name: Extract release model
        run: |
          mkdir -p release-model/extracted
          unzip -q "release-model/${MODEL_ASSET}" \
            -d release-model/extracted

      - name: Locate extracted model
        run: |
          find release-model/extracted -maxdepth 3 -type f | sort

      - name: Generate validation predictions
        run: |
          python scripts/predict_student.py \
            --model-dir release-model/extracted \
            --validation data/validation.jsonl \
            --output results/ci_predictions.jsonl

      - name: Run model evaluation
        run: |
          python tools/score.py \
            results/ci_predictions.jsonl \
            data/validation.jsonl \
            --out results/ci_validation.json

      - name: Quality gate
        run: |
          python tools/score.py \
            results/ci_predictions.jsonl \
            data/validation.jsonl \
            --min-validity 95


  secret-scan:
    name: 4 - Secret Scan
    runs-on: ubuntu-latest
    needs: model-evaluation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
